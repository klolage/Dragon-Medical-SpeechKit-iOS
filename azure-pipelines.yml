# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: windows-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'

- checkout: self
  persistCredentials: true

- task: DownloadPipelineArtifact@2
  inputs:
    buildType: 'specific'
    project: 'f787e026-7c19-4b78-92df-67dd5db79642'
    definition: '208'
    buildVersionToDownload: 'latest'
    allowPartiallySucceededBuilds: true
    artifactName: 'sdk'
    itemPattern: '**/**/*.dmg'
    targetPath: '$(Agent.TempDirectory)/sdk'

- script: |
    git config user.email "krishna.lolage@microsoft.com"
    git config user.name "klolage"
    git checkout -b release/v5.7.1
  displayName: 'Checkout release branch'

- task: 7zExtract@1
  inputs:
    Archive: '$(Agent.TempDirectory)/sdk/**/**/*.dmg'
    Folder: '$(System.DefaultWorkingDirectory)/sdk'

- task: ExtractFiles@1
  inputs:
    archiveFilePatterns: '$(Agent.TempDirectory)/sdk/**/*.dmg'
    destinationFolder: '$(System.DefaultWorkingDirectory)/sdk2'
    cleanDestinationFolder: true
    overwriteExistingFiles: false

- script: |
    git status"
  displayName: 'Git Status'